name: Scheduled Scans

# Informational scans, weekly + manual dispatch. Off the PR critical path but
# still RUNNING is the point: they catch drift that accrues against an UNCHANGED
# tree between PRs.
#
# S40: renamed from scheduled-scans.yml, content preserved (s40-gate-map.md).

on:
  schedule:
    # weekly, Sunday 10:54 UTC.
    - cron: '54 10 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  audit:
    # The SAME strict cargo-audit as ci.yml's per-PR gate — run weekly to catch
    # advisories newly published against UNCHANGED deps.
    name: Dependency Audit (weekly, strict)
    runs-on: ubuntu-latest
    timeout-minutes: 30    # mirrors ci.yml `audit`; obs max 199s there
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked
      # SEC-2-07: ignores live in .cargo/audit.toml with a justification.
      - run: cargo audit -D warnings

  geiger:
    # Informational: every unsafe site is already justified in
    # audit/unsafe-justifications.md, so archive the inventory, do not fail.
    name: Unsafe Inventory (cargo-geiger)
    runs-on: ubuntu-latest
    timeout-minutes: 60    # builds cargo-geiger from source + a full --all-features scan
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-geiger
        run: cargo +stable install cargo-geiger --locked
      - name: cargo geiger
        run: |
          cargo geiger --all-features --output-format Json > geiger.json
          cargo geiger --all-features || true
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-geiger-inventory
          path: geiger.json
          retention-days: 30

  machete:
    # Off the PR critical path deliberately: machete false-positives on
    # feature-gated re-exports, so an unused dep reddens THIS weekly run (loud)
    # without blocking PRs.
    name: Unused Deps (cargo-machete)
    runs-on: ubuntu-latest
    timeout-minutes: 30    # cache:'false' => always a cold source install
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          cache: 'false'
      - name: Install cargo-machete
        run: cargo +stable install cargo-machete --locked
      - run: cargo machete
