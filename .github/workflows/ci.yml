name: CI

# ExpressGateway CI — every per-PR/push BLOCKING gate, in one workflow.
#
# S40 consolidation: `ci.yml` and `prod-readiness-gates.yml` were merged here. NO
# gate was dropped — audit/release/s40-gate-map.md maps every old job to its new
# home and lists the required-status-check renames.
#
# Weekly informational scans are in scheduled.yml; tag build/publish + the soak
# release gate are in release.yml. Shared toolchain/cache/system-deps setup is
# single-sourced via the ./.github/actions/rust-setup composite (R12).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Must match rust-toolchain.toml. 1.88 is a hard floor: quiche 0.29.1 +
  # tokio-quiche 0.19 require it.
  RUST_MSRV: "1.88"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:


  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
          cache: 'false'
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
      # --all-features is REQUIRED: the R8 memory tests read lb-l7's
      # `#[cfg(feature = "test-gauges")]` gauges, which are off by default.
      - run: cargo check --workspace --all-targets --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  panic-freedom:
    name: Panic Freedom Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify panic-freedom deny lints are present in every library crate
        run: |
          MISSING=""
          for lib in crates/*/src/lib.rs; do
            # The deny attribute may span multiple lines.
            if ! grep -Pzoq '#!\[deny\([^)]*clippy::unwrap_used' "$lib" 2>/dev/null; then
              MISSING="$MISSING\n  $lib"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Crates missing panic-freedom deny lints:$MISSING"
            exit 1
          fi
          echo "All library crates have panic-freedom deny lints."

  doc-lint:
    # Tier-1 stale-pattern drift + tier-2 audit-of-audit (every Verified-Fixed
    # claim must resolve to a SHA that actually closes its recommendation).
    name: Doc Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Tier-2 walks historical SHAs — needs full history.
          fetch-depth: 0
      - run: bash scripts/ci/doc-lint.sh


  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
      # The --all-features test build links many large integration binaries and
      # hits ENOSPC on a hosted runner with a warm cache. Frees ~15-20 GB; no
      # assertion is affected.
      - uses: ./.github/actions/free-disk
      # The heavy real-wire e2e binaries (grpc_h3_e2e, ws_*) self-serialize via an
      # in-file `static SUITE_SERIAL` tokio Mutex.
      #
      # CF-FCAP1-FLAKE / CF-SATURATION-1: fcap1_h2_over_cap_upload_yields_413 must
      # push 66 MiB past the 64 MiB cap to assert 413, and sharing CPU with ~14
      # siblings starves that upload — so it is excluded here and run ALONE below.
      # Serialization, not weakening: same test, same assert_eq!(status, 413).
      - name: cargo test (suite minus the saturation-isolated fcap1)
        run: cargo test --workspace --all-features --no-fail-fast -- --skip fcap1_h2_over_cap_upload_yields_413
        timeout-minutes: 45
      - name: cargo test (fcap1 over-cap, isolated / serial, retry on env-flake)
        # Even isolated, the achievable rate varies (~0.3-1.1 MiB/s) and a noisy
        # neighbour can starve the 66 MiB transfer. Up to 3 attempts: a genuine cap
        # regression fails ALL three, only a slow-transfer env-flake is retried.
        run: |
          for attempt in 1 2 3; do
            echo "::group::fcap1 attempt $attempt"
            if cargo test -p lb-integration-tests --test h2h1_md_streaming_verify \
                 --all-features -- --exact fcap1_h2_over_cap_upload_yields_413 --nocapture; then
              echo "::endgroup::"; echo "fcap1 passed on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "fcap1 attempt $attempt failed (env throughput?); retrying"
          done
          echo "::error::fcap1 failed all 3 attempts — this is a real cap-enforcement failure, not an env flake"
          exit 1
        timeout-minutes: 25

  msrv:
    # The canonical "compiles on the MSRV" gate; full codegen is release-build.
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - run: cargo check --workspace --all-targets --all-features

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        # +nightly is REQUIRED: without it rust-toolchain.toml pins 1.88 and
        # cargo-platform (a cargo-fuzz dep, MSRV 1.91) fails to build. nightly is
        # already installed here and is what runs the targets below.
        run: cargo +nightly install cargo-fuzz --locked
      - name: Smoke test all fuzz targets (10 seconds each)
        run: |
          cd fuzz
          targets=$(cargo +nightly fuzz list)
          if [ -z "$targets" ]; then
            echo "::error::No fuzz targets discovered in fuzz/Cargo.toml"
            exit 1
          fi
          for target in $targets; do
            echo "::group::Fuzzing $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=10 2>&1
            echo "::endgroup::"
          done

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [check, clippy, test, fmt, panic-freedom, doc-lint]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
      - run: cargo build --workspace --release
        timeout-minutes: 30


  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # +stable: cargo-audit needs a newer rustc than rust-toolchain.toml's pin.
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked
      # SEC-2-07: fail on ANY RUSTSEC advisory; ignores live in .cargo/audit.toml
      # with a justification. The same audit runs weekly in scheduled.yml.
      - run: cargo audit -D warnings

  cargo-deny:
    # The subcommand list is explicit so a future change to cargo-deny's `check`
    # default cannot silently shrink the gate. This is the SINGLE cargo-deny gate.
    name: cargo-deny (licenses/advisories/bans/sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-deny (prebuilt binary)
        run: |
          VER=0.19.6
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VER}/cargo-deny-${VER}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/cargo-deny'
          cargo-deny --version
      - run: cargo-deny check licenses advisories bans sources


  coverage:
    # PER-MODULE >= 80%, not a whole-package aggregate (audit/coverage-scope.md).
    # The FULL suite runs under instrumentation so integration tests reach the hot
    # paths; coverage-check.sh is the verdict.
    name: Coverage (per-module hot-path >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_MSRV }}
          components: llvm-tools-preview
          system-deps: 'true'
      - uses: ./.github/actions/free-disk      # instrumented --workspace build is ~28 GB
      - name: Install cargo-llvm-cov + nextest
        run: |
          curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/.cargo/bin
          curl -fsSL https://get.nexte.st/latest/linux | tar -xz -C ~/.cargo/bin
      - name: Coverage (full workspace suite, --all-features)
        # --ignore-run-fail: this is the COVERAGE gate, not the pass/fail gate —
        # that is the `test` job. Measure coverage even if a test flakes.
        run: |
          cargo llvm-cov nextest \
            --workspace --all-features --ignore-run-fail \
            --lcov --output-path coverage.lcov
      - name: Enforce per-module hot-path threshold (charter metric)
        run: bash scripts/ci/coverage-check.sh coverage.lcov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage.lcov

  conformance:
    # H2 + H3 conformance against the REAL gateway. Tool versions are PINNED so
    # the h3spec waiver list (CF-QUICHE-UPGRADE) stays exact.
    name: Conformance (h2spec --strict + h3spec)
    runs-on: ubuntu-latest
    env:
      H2SPEC_VER: "v2.6.0"
      H3SPEC_VER: "v0.1.13"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_MSRV }}
          system-deps: 'true'
      - run: cargo build -p lb
      - name: Stub backend + test cert/key + QUIC retry secret
        run: |
          python3 -m http.server 3000 >/tmp/backend.log 2>&1 &
          echo $! > backend.pid
          # Cert validation is skipped by the specs' -k/-n (protocol conformance,
          # not PKI) — but the cert must still load into rustls + BoringSSL.
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 1 -nodes -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          head -c 32 /dev/urandom > retry.bin
      - name: Write conformance config (lb-config schema)
        run: |
          cat > conformance.toml <<TOML
          [runtime]
          drain_timeout_ms = 5000
          readiness_settle_ms = 100

          [[listeners]]
          address  = "127.0.0.1:8443"
          protocol = "h1s"
          [listeners.tls]
          cert_path = "$PWD/cert.pem"
          key_path  = "$PWD/key.pem"
          [[listeners.backends]]
          address  = "127.0.0.1:3000"
          protocol = "h1"
          weight   = 1

          [[listeners]]
          address  = "127.0.0.1:8444"
          protocol = "quic"
          [listeners.quic]
          cert_path         = "$PWD/cert.pem"
          key_path          = "$PWD/key.pem"
          retry_secret_path = "$PWD/retry.bin"
          [[listeners.backends]]
          address  = "127.0.0.1:3000"
          protocol = "h1"
          weight   = 1

          [observability]
          metrics_bind = "127.0.0.1:9090"
          TOML
          cat conformance.toml
      - name: Boot gateway + wait for BOTH listeners
        run: |
          ./target/debug/expressgateway conformance.toml >/tmp/gw.log 2>&1 &
          echo $! > gw.pid
          up=0
          for i in $(seq 1 40); do
            if ss -ltn | grep -q ':8443' && ss -lun | grep -q ':8444'; then up=1; break; fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::gateway listeners did not come up"; cat /tmp/gw.log; exit 1
          fi
          echo "both listeners up; gateway log:"; tail -5 /tmp/gw.log
      - name: h2spec --strict (HTTP/2 conformance, TCP :8443)
        run: |
          curl -fsSL "https://github.com/summerwind/h2spec/releases/download/${H2SPEC_VER}/h2spec_linux_amd64.tar.gz" | tar -xz
          # --strict fails on ANY non-conformant case. The gateway passes 147/147.
          ./h2spec -t -k -h 127.0.0.1 -p 8443 --strict
      - name: h3spec (HTTP/3 conformance, UDP :8444) via named-waiver gate
        run: |
          curl -fsSL -o h3spec "https://github.com/kazu-yamamoto/h3spec/releases/download/${H3SPEC_VER}/h3spec-linux-x86_64"
          chmod +x h3spec
          # PASSES iff every failure is one of the 12 named quiche-0.29 waivers
          # (CF-QUICHE-UPGRADE); a new/un-waived failure turns this RED.
          bash scripts/ci/h3spec-check.sh ./h3spec 127.0.0.1 8444
      - name: Stop gateway + backend
        if: always()
        run: |
          kill "$(cat gw.pid)" 2>/dev/null || true
          kill "$(cat backend.pid)" 2>/dev/null || true

  chaos-attacks:
    # The chaos ATTACK suite: Rapid Reset, CONTINUATION flood, HPACK bomb,
    # slowloris. The 4-hour soak is the release gate, not a PR gate.
    name: Chaos Attack Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_MSRV }}
          system-deps: 'true'
      - name: Install cargo-nextest
        run: curl -fsSL https://get.nexte.st/latest/linux | tar -xz -C ~/.cargo/bin
      - run: cargo build -p lb
      - name: Run chaos attack suite
        # --all-features keeps the lb-l7/lb-h2 test surface identical to the
        # session gate.
        run: |
          cargo nextest run --all-features --package lb-h2 --package lb-l7 \
            -E 'test(/chaos|rapid_reset|continuation|hpack|slowloris/)'


  image-scan:
    # Builds the image ONCE, proves it BOOTS and SERVES via docker-smoke.sh, then
    # Trivy-scans that same image. `docker build` exit-0 was never proof the
    # container works: a pre-S35 image had a CMD that could not boot.
    name: Container Image (build + serve smoke + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg GIT_SHA="${GITHUB_SHA::8}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VERSION="ci-${GITHUB_SHA::8}" \
            -t expressgateway:ci .
      - name: Smoke — RUN the container and serve a real request through it
        run: IMAGE=expressgateway:ci bash scripts/ci/docker-smoke.sh
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: expressgateway:ci
          format: table
          exit-code: "1"                 # fail the job on findings
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  xdp-smoke:
    # RUNNER-KERNEL ONLY: loads the committed XDP ELF into the runner's own
    # kernel verifier and asserts ACCEPT. It does NOT cover the 5.15/6.1/6.6
    # matrix — that needs nested virt hosted runners lack (F-ESC-1).
    name: XDP Verifier Smoke (runner kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_MSRV }}
          system-deps: 'true'
      - name: Print runner kernel (for the record — smoke is THIS kernel only)
        run: uname -r
      - name: Build the real-load verifier test (validates the embedded ELF too)
        run: cargo test -p lb-l4-xdp --test round8_verifier_baseline_70 --no-run
      - name: Load the committed XDP ELF and assert verifier ACCEPT
        # The committed ELF (scripts/build-xdp.sh) uses aya LEGACY map definitions
        # that libbpf v1.0+ tools (bpftool, ip) REFUSE to load — aya, the gateway's
        # own loader, is the only one that can. The test does a genuine
        # BPF_PROG_LOAD on the running kernel and asserts prog_id/tag/
        # verified_insns > 0. Needs CAP_BPF + bpffs, hence sudo + --ignored.
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" cargo test -p lb-l4-xdp \
            --test round8_verifier_baseline_70 -- --ignored --nocapture
