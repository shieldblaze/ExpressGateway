version: 2

# Dependabot: daily dependency update checks.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
        # dtolnay/rust-toolchain is versioned by RUST TOOLCHAIN (@1.88), not by
        # action release — the "*" group read the toolchain tag as an action
        # version and proposed a bogus @1.100 bump (#214). rust-toolchain.toml
        # governs it.
        exclude-patterns:
          - "dtolnay/rust-toolchain"
